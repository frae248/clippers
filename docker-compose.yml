services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker-api:
    build:
      context: ./backend
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: >
      sh -c "apt-get update && apt-get install -y ffmpeg &&
      pip install -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery-worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: >
      sh -c "apt-get update && apt-get install -y ffmpeg &&
      pip install -r requirements.txt &&
      celery -A worker.celery_app worker --loglevel=info --concurrency=2"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
